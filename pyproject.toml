[project]
name = "leaf-valley"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
leaf-valley = "leaf_valley:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
