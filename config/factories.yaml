# Source of truth for factories, items, emojis and role names.
# - `key` fields are stable internal IDs (safe to rename display name/emoji later).
# - `channel_id` is where each factory message is posted (0 = TODO, fill in real IDs).
# - `image` is a file in assets/factories/, or null for no picture (embed only).
# - `emoji` uses `:name:` custom application emojis seeded from assets/emojis/ by
#   scripts/seed_emojis.py (the name matches the image filename without extension).
# Only items that currently have an emoji in assets/emojis/ are listed here.

